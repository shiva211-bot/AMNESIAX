name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Rust and Cargo automatically
      - name: Install Rust Toolchain
        uses: rust-lang/setup-rust-toolchain@v1

      # 3. Run your tests
      - name: Run Cargo Tests
        run: cargo test --verbose
